syntax = "proto3";

package api;

option go_package = "github.com/MauveSoftware/http-check/internal/api";

message Request {
  string protocol = 1;
  string host = 2;
  string path = 3;
  string username = 4;
  string password = 5;
  repeated uint32 expected_status_code = 6;
  string expected_body = 7;
  string expected_body_regex = 8;
  uint32 cert_expire_days = 9;
  bool debug = 10;
  bool insecure = 11;
  bool do_not_follow_redirects = 12;
  map<string, string> expected_headers = 13;
  map<string, string> expected_header_regexes = 14;
}

message Response {
  bool success = 1;
  string message = 2;
  string debug_message = 3;
}

service HttpCheckService {
  rpc Check(Request) returns (Response) {}
}
